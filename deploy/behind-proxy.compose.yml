# Override for servers where the HOST's nginx already serves the domain with TLS (e.g. Let's Encrypt
# with automatic renewal). The web container then listens on HTTP at 127.0.0.1:${WEB_LOCAL_PORT}
# only, and the host nginx proxies to it. Use together with docker-compose.prod.yml:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml -f deploy/signing.compose.yml \
#     -f deploy/behind-proxy.compose.yml up -d
services:
  web:
    ports: !override
      - "127.0.0.1:${WEB_LOCAL_PORT:-8080}:80"
    volumes: !override
      - ./deploy/nginx/behind-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
